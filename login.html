<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · CMP 26-27</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-apple-touch.png">
<meta name="theme-color" content="#1c1a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/auth.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-bar">
    <a class="brand" href="index.html">
      <img class="logo-icon" src="img/logo-icon-white.png" alt="Colegio Mayor Peñafiel">
      <span class="titulos">
        <span class="titulo-principal">CMP 26-27</span>
      </span>
    </a>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Inicio</a> / Entrar</div>
    <h1>Entrar</h1>
  </div>
</div>

<main>
  <div class="container">

    <form class="formulario" id="form-login" method="post" action="#" style="max-width:420px; margin:0 auto;">
      <fieldset>
        <legend>¿Quién eres?</legend>
        <div class="campo">
          <label for="rol">Rol</label>
          <select id="rol" name="username" autocomplete="username" required>
            <option value="residente">Residente</option>
            <option value="colegial">Colegial</option>
            <option value="staff">Staff</option>
          </select>
        </div>
        <div class="campo">
          <label for="clave">Clave</label>
          <input type="password" id="clave" name="password" autocomplete="current-password" required autofocus>
        </div>
      </fieldset>
      <div class="form-envio">
        <button type="submit" class="form-boton" id="boton-entrar">Entrar</button>
        <span class="form-estado" id="estado-login"></span>
      </div>
    </form>

  </div>
</main>

<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var form = document.getElementById("form-login");
  var estado = document.getElementById("estado-login");
  var params = new URLSearchParams(window.location.search);
  var destino = params.get("redirect") || "index.html";

  form.addEventListener("submit", async function (evento) {
    evento.preventDefault();
    var rol = document.getElementById("rol").value;
    var clave = document.getElementById("clave").value;
    estado.textContent = "Comprobando…";
    estado.className = "form-estado enviando";

    var ok = await CMP_AUTH.comprobarClave(rol, clave);
    if (ok) {
      CMP_AUTH.iniciarSesion(rol);
      estado.textContent = "";
      window.location.href = destino;
    } else {
      estado.textContent = "Clave incorrecta.";
      estado.className = "form-estado";
      estado.style.color = "#b3261e";
    }
  });
});
</script>

</body>
</html>
